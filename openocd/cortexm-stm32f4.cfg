# cortexm-stm32f4.cfg — STMicro STM32F4 (Cortex-M4) board cfg. Sets the chip constants the generic
# Cortex-M scripts read, then sources the shared cortexm.cfg. Adapter via JTAG_IFACE (default cmsis-dap).
set CM_TARGET    stm32f4x
set CM_FLASH_BASE 0x08000000
set CM_FLASH_SIZE 0x00100000   ;# 1 MB (F407/F429-class; adjust per part)
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00020000   ;# 128 KB
set CM_PROT_KIND  stm32-rdp
source [file join [file dirname [info script]] cortexm.cfg]
