# esp32c3.cfg — Espressif ESP32-C3 (single-core RISC-V RV32IMC). Uses OpenOCD's esp32c3 target over the
# built-in USB-JTAG or an external JTAG adapter. Extraction/bypass model is the same as ESP32 (esptool
# download mode + eFuse flash-encryption/secure-boot; FI bypass deferred).
if {[info exists ::env(JTAG_IFACE)]} { source [find $::env(JTAG_IFACE)] } else { source [find interface/esp_usb_jtag.cfg] }
set ESP_RTOS none
source [find target/esp32c3.cfg]
