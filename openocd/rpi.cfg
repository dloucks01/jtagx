# rpi.cfg — OpenOCD config for a Raspberry Pi (BCM2xxx, ARM Cortex-A, Linux). Paradigm A.
#
# IMPORTANT — a Pi cannot be auto-identified by JTAG: its only TAP is the generic ARM DAP
# (IDCODE 0x4ba00477), identical to ZynqMP's / Zynq-7000's DAP. So this is an OPERATOR-ASSERTED
# target (board-runner --profile bcm), not a fingerprint match.
#
# PREREQUISITE: JTAG is OFF by default on a Pi. Enable it in config.txt (`enable_jtag_gpio=1`) and
# wire an external adapter (e.g. FT2232H) to the GPIO ALT JTAG pins. (If you can edit config.txt you
# already have filesystem access — so the JTAG path is mainly for live-memory / anti-forensic work.)
#
#   JTAG_IFACE  interface cfg for your adapter (default: generic FT2232H)
#   JTAG_SPEED  adapter clock kHz (default 1000)
#   RPI_CHIP    bcm2837 (Pi 3, default) | bcm2711 (Pi 4) | bcm2837b0 ... (stock OpenOCD target name)
#
# Creates an `rpi.axi` mem-AP alias (AHB-AP / AP0) so board-profile.tcl auto-detects it for
# dump-os-ddr.tcl. The stock cfg's cores are <chip>.cpu0..3 (aarch64) and the dap is <chip>.dap.

if {[info exists ::env(JTAG_IFACE)]} {
    source [find $::env(JTAG_IFACE)]
} else {
    source [find openocd/adapters/ft2232h-generic.cfg]
}
transport select jtag
if {[info exists ::env(JTAG_SPEED)]} { adapter speed $::env(JTAG_SPEED) } else { adapter speed 1000 }

set _rpi_chip bcm2837
if {[info exists ::env(RPI_CHIP)]} { set _rpi_chip $::env(RPI_CHIP) }
source [find target/$_rpi_chip.cfg]

# Pi boards expose TRST only, no SRST.
catch { reset_config trst_only }

# mem-AP alias (AP0) named with "axi" so board-profile.tcl auto-detects it (the stock cfg also
# makes <chip>.ap on the same AP — harmless to have both).
catch { target create rpi.axi mem_ap -dap $_rpi_chip.dap -ap-num 0 }

# core-0 CoreSight debug base for pi-enumerate.tcl (AUTHSTATUS). Pi3/bcm2837=0x80010000, Pi4/bcm2711=0x80410000.
if {$_rpi_chip eq "bcm2711"} { set PI_DBGBASE 0x80410000 } else { set PI_DBGBASE 0x80010000 }
