# cortexm-stm32h7.cfg — STMicro STM32H7 (Cortex-M7, dual-bank). RDP option bytes like the F4 but a
# 2 MB dual-bank flash. Sized for an H743-class part; adjust CM_FLASH_SIZE per device.
set CM_TARGET    stm32h7x
set CM_FLASH_BASE 0x08000000
set CM_FLASH_SIZE 0x00200000   ;# 2 MB (H743/H753)
set CM_SRAM_BASE  0x24000000
set CM_SRAM_SIZE  0x00080000   ;# 512 KB AXI SRAM
set CM_PROT_KIND  stm32-rdp
source [file join [file dirname [info script]] cortexm.cfg]
