# ft2232h-generic.cfg — generic FTDI FT2232H (channel A / MPSSE) JTAG, explicit pin layout.
#
# Use this when you HAND-WIRE an FT2232H mini-module / breakout to a board's JTAG header
# (the vendor cfgs assume a specific product + wiring). Use as JTAG_IFACE with board-template.cfg:
#   JTAG_IFACE=openocd/adapters/ft2232h-generic.cfg JTAG_SPEED=300 \
#     openocd -f openocd/board-template.cfg -c "init; source openocd/jtag-access-check.tcl; shutdown"
#
# Standard MPSSE JTAG pinout on channel A (ADBUS):
#   ADBUS0 = TCK   ADBUS1 = TDI   ADBUS2 = TDO (input)   ADBUS3 = TMS
#   ADBUS4..7 = optional nTRST / nSRST / LEDs — adapter-specific, wire + declare below.
#
# Set vid_pid to YOUR device (run `lsusb` / tools/gen-board-cfg.py). 0403:6010 is a stock FT2232H;
# clones and vendor modules vary.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# layout_init <output-values> <output-direction> (16-bit: low byte = ADBUS, high byte = ACBUS).
# Outputs: TCK(b0) TDI(b1) TMS(b3) = direction 0x000b; TDO(b2) is input. Idle TMS high = 0x0008.
ftdi layout_init 0x0008 0x000b

# Reset lines are board/adapter specific — uncomment and set the bit that matches YOUR wiring:
#   ftdi layout_signal nTRST -data 0x0010 -oe 0x0010      ;# e.g. ADBUS4
#   ftdi layout_signal nSRST -data 0x0020 -oe 0x0020      ;# e.g. ADBUS5 (open-drain on many boards)
# Note: transport + adapter speed are set by board-template.cfg, not here.
