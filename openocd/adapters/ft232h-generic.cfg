# ft232h-generic.cfg — generic FTDI FT232H (single-channel MPSSE) JTAG, explicit pin layout.
#
# The FT232H is single-channel; same ADBUS MPSSE pinout as the FT2232H channel A. This is the
# chip on Adafruit FT232H breakouts and (with a product filter) the Digilent JTAG-SMT2 on ZCU10x.
# Use as JTAG_IFACE with board-template.cfg:
#   JTAG_IFACE=openocd/adapters/ft232h-generic.cfg JTAG_SPEED=1000 \
#     openocd -f openocd/board-template.cfg -c "init; source openocd/jtag-access-check.tcl; shutdown"
#
# Pinout (ADBUS): ADBUS0=TCK  ADBUS1=TDI  ADBUS2=TDO(in)  ADBUS3=TMS
# Set vid_pid to YOUR device. 0403:6014 is the stock FT232H; for an actual Digilent SMT2 prefer
# the stock interface/ftdi/digilent_jtag_smt2_nc.cfg (it adds the product-string filter).

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0008 0x000b

# Optional reset lines (set the bit matching your wiring):
#   ftdi layout_signal nSRST -data 0x0020 -oe 0x0020
# Note: transport + adapter speed are set by board-template.cfg, not here.
