# OpenOCD config for ZCU102 with the PMU MicroBlaze BSCAN TAP enabled.
#
# Standard zcu102.cfg only declares 2 TAPs (DAP + PS), which works when
# CSU.JTAG_SEC.SSSS_PMU_SEC is sealed (the default). The HYPOTHESIS this config tests is that
# opening PMU_SEC (bits [8:6] = 0b111) inserts the PMU MicroBlaze BSCAN TAP into the chain
# between DAP and PS. NOTE (corrected 2026-06-10 vs zynqmp_pmufw/src/csu.h): the earlier theory
# that JTAG_CHAIN_CFG=0x07 / JTAG_CHAIN_STATUS bit 2 link the PMU TAP is WRONG — those regs only
# manage ARM_DAP[1]/PL_TAP[0] (no PMU bit). The sole lever is JTAG_SEC.SSSS_PMU_SEC. Whether that
# alone exposes the TAP is the open question — if this scan still shows 2 TAPs with PMU_SEC open,
# the BSCAN-TAP route is closed (PMU_SEC gates debug access, not scan-chain presence).
#
# Chain order (high → low, head-of-chain first):
#   DAP TAP (uscale.tap)    IRLEN=4, IDCODE 0x5BA00477  (ARM CoreSight)
#   PMU TAP (uscale.pmu)    IRLEN=4, no IDCODE          (MicroBlaze BSCAN-MB)
#   PS TAP  (uscale.ps)     IRLEN=12, IDCODE 0x24738093 (Xilinx PS)
#
# Total IR length: 4 + 4 + 12 = 20 bits (vs. 4 + 12 = 16 bits when PMU TAP sealed).
#
# This config does NOT auto-open PMU_SEC. Run the open-pmu-tap.tcl script
# first (or run it as a sourced setup step) BEFORE init scans the chain.
# Otherwise the first scan will see only 2 TAPs and OpenOCD will complain
# about chain length mismatch.
#
# Usage:
#   1. Open PMU_SEC first (writes JTAG_SEC.SSSS_PMU_SEC=0b111 via the AXI-AP):
#      openocd -f openocd/zcu102.cfg -c "init; source openocd/open-pmu-tap.tcl; shutdown"
#   2. Without power-cycling, run this config:
#      openocd -f openocd/zcu102-3tap.cfg -c "init; scan_chain; shutdown"
#
# If the chain shows 3 TAPs (total IR length 20), the PMU MicroBlaze BSCAN TAP linked in — but
# DRIVING it (halt the MicroBlaze, read the PMU ROM from its local bus) requires MicroBlaze MDM
# support OpenOCD largely lacks; that's a separate, harder step, not a given.

source [find interface/ftdi/digilent_jtag_smt2_nc.cfg]
transport select jtag
adapter speed 1000

set _CHIPNAME uscale

# DAP TAP (ARM CoreSight; head of chain)
jtag newtap $_CHIPNAME tap -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id 0x5ba00477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.tap

# PMU MicroBlaze BSCAN TAP. IRLEN=4 per typical MicroBlaze BSCAN.
# IDCODE is typically not exposed by BSCAN-MB; we declare -expected-id 0
# and rely on -ignore-version. If init complains about IDCODE mismatch,
# adjust to the actual value observed.
jtag newtap $_CHIPNAME pmu -irlen 4 -ircapture 0x1 -irmask 0xf \
    -ignore-version -expected-id 0

# PS TAP (Xilinx PS / programmable system; tail of chain)
jtag newtap $_CHIPNAME ps -irlen 12 -ircapture 0x1 -irmask 0x03 \
    -ignore-version \
    -expected-id 0x04738093 \
    -expected-id 0x04711093 \
    -expected-id 0x04710093 \
    -expected-id 0x04721093 \
    -expected-id 0x04720093 \
    -expected-id 0x04739093 \
    -expected-id 0x04730093 \
    -expected-id 0x04740093 \
    -expected-id 0x04750093 \
    -expected-id 0x04759093 \
    -expected-id 0x04758093

# Note: no DAP setup hook is registered here. The standard xilinx_zynqmp.cfg
# setup hook sends irscan 0x824 + drscan 0x00000003 to PS TAP to enable
# DAP + PL_TAP. Our chain assumes PMU_SEC is already opened upstream, so
# we don't need to set those bits again — but we might need to send
# irscan 0x824 + drscan 0x00000007 (bits 0,1,2) to enable PMU TAP too.
# Add this as a follow-up if init fails.
