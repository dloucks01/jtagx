# OpenOCD board config for AMD Zynq UltraScale+ MPSoC ZCU102 evaluation kit
# Uses on-board Digilent SMT2 (FT232H 0403:6014) for JTAG transport.

source [find interface/ftdi/digilent_jtag_smt2_nc.cfg]
transport select jtag
# 15 MHz: empirically the max stable clock on this board (bench-axi.tcl, 2026-06-12) — 8.1x faster AXI
# dumps than the old 1 MHz (12.2 -> 99.3 KB/s), 0 read failures, chain scans clean. The FT232H divisor
# only offers 15 or 30 MHz up here; 30 fails every read. Drop to 10000 if you ever see "Invalid ACK".
adapter speed 15000

source [find target/xilinx_zynqmp.cfg]

# APB-debug mem-AP (AP1) for the EDPCSR / debug-gate enumeration (enumerate.tcl §8).
# Must be created at config time — OpenOCD 0.12 cannot `target create` after init.
# enum-helpers.tcl's dbg_ap_init finds it ready; harmless if unused.
catch { target create uscale.dbg mem_ap -dap uscale.dap -ap-num 1 }
