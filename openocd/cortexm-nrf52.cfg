# cortexm-nrf52.cfg — Nordic nRF52 (Cortex-M4) board cfg. Defaults sized for nRF52840 (1 MB / 256 KB);
# for nRF52832 set CM_FLASH_SIZE=0x80000 CM_SRAM_SIZE=0x10000.
set CM_TARGET    nrf52
set CM_FLASH_BASE 0x00000000
set CM_FLASH_SIZE 0x00100000   ;# nRF52840 1 MB
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00040000   ;# 256 KB
set CM_PROT_KIND  nrf-approtect
source [file join [file dirname [info script]] cortexm.cfg]
