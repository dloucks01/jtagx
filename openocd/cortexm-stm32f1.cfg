# cortexm-stm32f1.cfg — STMicro STM32F1 (Cortex-M3). RDP is a single bit in FLASH_OBR (RDPRT).
set CM_TARGET    stm32f1x
set CM_FLASH_BASE 0x08000000
set CM_FLASH_SIZE 0x00080000   ;# up to 512 KB (high-density)
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00010000   ;# 64 KB
set CM_PROT_KIND  stm32f1
source [file join [file dirname [info script]] cortexm.cfg]
