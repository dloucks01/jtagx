# imx6.cfg — NXP i.MX6 (Cortex-A9, Linux). Paradigm A — generic DRAM dump over the mem-AP. Adapter via JTAG_IFACE.
if {[info exists ::env(JTAG_IFACE)]} { source [find $::env(JTAG_IFACE)] } else { source [find interface/ftdi/digilent_jtag_smt2_nc.cfg] }
transport select jtag
if {[info exists ::env(JTAG_SPEED)]} { adapter speed $::env(JTAG_SPEED) } else { adapter speed 1000 }
set CHIPNAME imx6
source [find target/imx6.cfg]
catch { target create imx6.axi mem_ap -dap imx6.dap -ap-num 0 }   ;# AHB-AP, named "axi" for board-profile auto-detect
