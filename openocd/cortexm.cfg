# cortexm.cfg — shared env/global-driven OpenOCD config for a Cortex-M MCU (Paradigm B). SWD by default.
# Don't use this directly — use a per-family wrapper (cortexm-stm32f4.cfg / -nrf52.cfg / -rp2040.cfg)
# that sets the chip constants (CM_TARGET + CM_FLASH_*/CM_SRAM_*/CM_PROT_* globals) and sources this.
#
#   JTAG_IFACE    adapter interface cfg (default interface/cmsis-dap.cfg; ST-Link: interface/stlink.cfg)
#   CM_TRANSPORT  swd (default) | jtag
#   JTAG_SPEED    adapter clock kHz (default 1000)
#   CM_TARGET     stock OpenOCD target name to source from target/ (e.g. stm32f4x, nrf52, rp2040)
#                 — set as a global by the wrapper, or via the CM_TARGET env var.

if {[info exists ::env(JTAG_IFACE)]} {
    source [find $::env(JTAG_IFACE)]
} else {
    source [find interface/cmsis-dap.cfg]
}
if {[info exists ::env(CM_TRANSPORT)]} { transport select $::env(CM_TRANSPORT) } else { transport select swd }
if {[info exists ::env(JTAG_SPEED)]} { adapter speed $::env(JTAG_SPEED) } else { adapter speed 1000 }

if {![info exists CM_TARGET] && [info exists ::env(CM_TARGET)]} { set CM_TARGET $::env(CM_TARGET) }
if {![info exists CM_TARGET]} {
    echo "ERROR: CM_TARGET not set. Use a per-family wrapper (cortexm-stm32f4.cfg) or CM_TARGET=stm32f4x."
    shutdown
}
source [find target/$CM_TARGET.cfg]
