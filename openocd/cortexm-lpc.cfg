# cortexm-lpc.cfg — NXP LPC (Cortex-M3, LPC176x-class). Code-Read-Protection (CRP) is a
# flash word at 0x000002FC, not a debug register; the ISP serial bootloader mass-erase is the
# recovery lever (destructive). CM_PROT_KIND=none → generic mem-AP read (CRP is read from flash).
set CM_TARGET    lpc
set CM_FLASH_BASE 0x00000000
set CM_FLASH_SIZE 0x00080000   ;# 512 KB (LPC1768)
set CM_SRAM_BASE  0x10000000   ;# main SRAM 32 KB (+ AHB SRAM at 0x2007C000, not covered here)
set CM_SRAM_SIZE  0x00008000   ;# 32 KB
set CM_PROT_KIND  none
source [file join [file dirname [info script]] cortexm.cfg]
