# zynq7000.cfg — OpenOCD config for AMD/Xilinx Zynq-7000 (XC7Z, dual Cortex-A9 + FPGA).
# Paradigm A (ARM Cortex-A + MMU + external DRAM), like ZynqMP but 32-bit ARMv7-A and a different
# register map (UG585). Adapter is env-driven like board-template.cfg; defaults to the Digilent
# on-board FT232H used by the ZC702/ZC706 eval kits.
#
#   JTAG_IFACE  interface cfg for your adapter (default: Digilent SMT2/FT232H)
#   JTAG_SPEED  adapter clock kHz (default 1000; lower for long leads)
#
# This creates the two mem-APs the capability scripts use:
#   zynq.axi  = AHB-AP (AP0) — system memory master for physical R/W (named "axi" so board-profile.tcl
#              auto-detects it; on Zynq-7000 the DAP masters the PS AXI interconnect via the AHB-AP).
#   zynq.apb  = APB-AP (AP1) — debug APB, for EDPCSR / debug-gate reads.

if {[info exists ::env(JTAG_IFACE)]} {
    source [find $::env(JTAG_IFACE)]
} else {
    source [find interface/ftdi/digilent_jtag_smt2_nc.cfg]
}
transport select jtag
if {[info exists ::env(JTAG_SPEED)]} { adapter speed $::env(JTAG_SPEED) } else { adapter speed 1000 }

source [find target/zynq_7000.cfg]

# Memory mem-AP (AHB-AP = AP0) for physical reads/writes (dump-os-ddr / zynq7000-flash / Cap-2 patch).
# Must be created at config time — OpenOCD 0.12 cannot `target create` after init.
catch { target create zynq.axi mem_ap -dap zynq.dap -ap-num 0 }
# Debug APB mem-AP (AP1) — optional, for debug-register reads.
catch { target create zynq.apb mem_ap -dap zynq.dap -ap-num 1 }
