# board-template.cfg — adapter-agnostic OpenOCD config for bringing up a NEW ZynqMP
# board on an engagement. The shipped zcu102.cfg is hardwired to the eval kit's on-board
# Digilent FT232H; a production/tactical board means a different adapter, speed, and
# possibly a different TAP layout. Drive this with env vars, or copy it to <board>.cfg
# and hardcode the values once you know them.
#
# REQUIRED
#   JTAG_IFACE   path to the OpenOCD interface cfg for YOUR adapter. Examples:
#                  interface/ftdi/digilent_jtag_smt2_nc.cfg   Digilent SMT2 / FT232H (ZCU10x on-board)
#                  interface/ftdi/olimex-arm-usb-ocd-h.cfg    Olimex FT2232H
#                  interface/ftdi/minimodule.cfg              generic FT2232H mini-module
#                  interface/jlink.cfg                        SEGGER J-Link
#                  interface/ftdi/um232h.cfg                  FT232H breakout
#                List what's installed:  ls /usr/share/openocd/scripts/interface/ftdi/
#
# OPTIONAL
#   JTAG_SPEED   adapter clock in kHz. START LOW — default 1000. Field/tactical boards with
#                long or ribbon JTAG leads often need 200-500 kHz before the chain is stable;
#                raise only after IDCODEs read cleanly.
#   JTAG_TARGET  target cfg. Default target/xilinx_zynqmp.cfg (2-TAP: PS-TAP + Arm DAP).
#                For a board that exposes the PMU BSCAN TAP, use the 3-TAP recipe in
#                openocd/zcu102-3tap.cfg instead. discover.tcl tells you which you have.
#
# Typical first run (J-Link @ 2 MHz, then the access verdict):
#   JTAG_IFACE=interface/jlink.cfg JTAG_SPEED=2000 \
#     openocd -f openocd/board-template.cfg \
#       -c "init; source openocd/jtag-access-check.tcl; shutdown"
#
# See docs/18-new-board-bringup.md for the full stage-by-stage runbook.

if {![info exists ::env(JTAG_IFACE)]} {
    echo "ERROR: JTAG_IFACE is unset. Point it at your adapter's interface cfg, e.g."
    echo "       JTAG_IFACE=interface/jlink.cfg openocd -f openocd/board-template.cfg ..."
    echo "       (see the header of this file, and docs/18-new-board-bringup.md)"
    shutdown
}
source [find $::env(JTAG_IFACE)]

transport select jtag

# Adapter clock — kept slow by default; raise once the chain is proven stable.
if {[info exists ::env(JTAG_SPEED)]} {
    adapter speed $::env(JTAG_SPEED)
} else {
    adapter speed 1000
}

# SRST/TRST: many field boards gate, share, or omit the reset lines. Leave OpenOCD's reset
# handling to the operator. Uncomment ONLY if your harness actually wires SRST:
#   reset_config srst_only srst_open_drain
# If a board holds the chain in reset until SRST is asserted, you may also need:
#   reset_config trst_and_srst

# Target config. Default to stock ZynqMP; discover.tcl / jtag-access-check.tcl will tell you
# if the silicon is actually a different SoC (Zynq-7000, Versal, non-Xilinx) — in which case
# enumerate.tcl does NOT apply and you override JTAG_TARGET / change toolset accordingly.
if {[info exists ::env(JTAG_TARGET)]} {
    source [find $::env(JTAG_TARGET)]
} else {
    source [find target/xilinx_zynqmp.cfg]
}

# APB-debug mem-AP (AP1) for the EDPCSR PC-sampling + invasive-debug-gate checks
# (enumerate.tcl §8 and jtag-access-check.tcl). Must be created at config time — OpenOCD
# 0.12 cannot `target create` after init. Harmless on non-ZynqMP targets (catch swallows it).
catch { target create uscale.dbg mem_ap -dap uscale.dap -ap-num 1 }
