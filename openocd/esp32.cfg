# esp32.cfg — Espressif ESP32 (dual Xtensa LX6). Paradigm C. Stock OpenOCD has the xtensa target. RAM is read
# via the core; external SPI flash + the secure-boot/flash-encryption eFuses are vendor-tool territory
# (esptool.py / espefuse.py). AXI_TARGET = the core.
if {[info exists ::env(JTAG_IFACE)]} { source [find $::env(JTAG_IFACE)] } else { source [find interface/ftdi/esp32-bridge.cfg] }
transport select jtag
if {[info exists ::env(JTAG_SPEED)]} { adapter speed $::env(JTAG_SPEED) } else { adapter speed 1000 }
source [find target/esp32.cfg]
set ::AXI_TARGET esp32.cpu0
