# cortexm-nrf54.cfg — Nordic nRF54L15 (Cortex-M33, TrustZone-M). The nRF54L moves OFF the nRF52/53
# APPROTECT register model to Arm ADAC (Authenticated Debug Access Control) + device lifecycle states,
# so CM_PROT_KIND=none here (a naive APPROTECT read would misreport). Debug-auth posture is the
# authenticated-debug frontier — see profiles/nrf54.json + jtagx.debugauth. RRAM (not flash) at 0x0.
set CM_TARGET    nrf54
set CM_FLASH_BASE 0x00000000
set CM_FLASH_SIZE 0x00180000   ;# 1.5 MB RRAM (nRF54L15)
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00040000   ;# 256 KB
set CM_PROT_KIND  none
source [file join [file dirname [info script]] cortexm.cfg]
