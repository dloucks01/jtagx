# cortexm-gd32.cfg — GigaDevice GD32 (STM32-compatible Cortex-M clone). Most GD32F1/F3/F4 parts work
# with OpenOCD's stm32f1x/stm32f4x flash driver + option-byte RDP interface. Sized for a GD32F4-class
# part; adjust CM_FLASH_SIZE per device. NOTE: GD32 readout protection is weaker than genuine STM32
# (see jtagx.weakness stm32-clone-rdp-gap / cve GD32-RDP-bypass).
set CM_TARGET    stm32f4x
set CM_FLASH_BASE 0x08000000
set CM_FLASH_SIZE 0x00100000   ;# 1 MB (GD32F407-class; adjust per part)
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00030000   ;# 192 KB (GD32F4)
set CM_PROT_KIND  stm32-rdp
source [file join [file dirname [info script]] cortexm.cfg]
