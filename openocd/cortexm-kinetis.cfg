# cortexm-kinetis.cfg — NXP Kinetis K64 (Cortex-M4). Flash security via FTFE_FSEC; SRAM_L+U around 0x20000000.
set CM_TARGET    kx
set CM_FLASH_BASE 0x00000000
set CM_FLASH_SIZE 0x00100000   ;# 1 MB (K64)
set CM_SRAM_BASE  0x1FFF0000   ;# SRAM_L (64KB) + SRAM_U (192KB) contiguous through 0x2002FFFF
set CM_SRAM_SIZE  0x00040000   ;# 256 KB total
set CM_PROT_KIND  kinetis-fsec
source [file join [file dirname [info script]] cortexm.cfg]
