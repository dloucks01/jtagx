# sama5.cfg — Atmel/Microchip SAMA5D2 (Cortex-A5, Linux). Paradigm A — generic DRAM dump.
if {[info exists ::env(JTAG_IFACE)]} { source [find $::env(JTAG_IFACE)] } else { source [find interface/ftdi/digilent_jtag_smt2_nc.cfg] }
transport select jtag
if {[info exists ::env(JTAG_SPEED)]} { adapter speed $::env(JTAG_SPEED) } else { adapter speed 1000 }
set CHIPNAME sama5d2
source [find target/at91sama5d2.cfg]
catch { target create sama5.axi mem_ap -dap sama5d2.dap -ap-num 0 }
