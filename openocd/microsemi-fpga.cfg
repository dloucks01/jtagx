# microsemi-fpga.cfg — adapter + TAP config for a Microsemi/Microchip fabric part (IGLOO2 / SmartFusion2
# fabric side) over a STANDARD FTDI adapter — NO FlashPro required for identify / boundary-scan / SVF.
#
# The fabric TAP is a plain IEEE-1149.1 TAP (IR length 8). This reaches IDCODE, boundary-scan
# (EXTEST/SAMPLE), and SVF/STAPL playback — which is enough to identify the device, read its pins, and
# (if security is NOT provisioned) read/program eNVM + the fabric bitstream. FlashPro/Libero is needed
# only for pass-key / AES-gated operations on a provisioned device.
#
#   JTAG_IFACE   adapter interface cfg (default interface/ftdi/digilent-hs2.cfg)
#   JTAG_SPEED   adapter clock kHz (default 1000; drop to 300 if the chain is flaky)
#   MSS_IRLEN    fabric TAP IR length (default 8 — IGLOO2 / SmartFusion2 fabric)
#
#   openocd -f openocd/microsemi-fpga.cfg -c "init; source openocd/microsemi-access-check.tcl; shutdown"

if {[info exists ::env(JTAG_IFACE)]} {
    source [find $::env(JTAG_IFACE)]
} else {
    source [find interface/ftdi/digilent-hs2.cfg]
}
transport select jtag
if {[info exists ::env(JTAG_SPEED)]} { adapter speed $::env(JTAG_SPEED) } else { adapter speed 1000 }

set _IRLEN 8
if {[info exists ::env(MSS_IRLEN)]} { set _IRLEN $::env(MSS_IRLEN) }

# a generic TAP so IDCODE + irscan/drscan + svf work without a vendor driver
jtag newtap msfabric tap -irlen $_IRLEN -expected-id 0x00000000 -ignore-version
