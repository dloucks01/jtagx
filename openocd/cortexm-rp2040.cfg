# cortexm-rp2040.cfg — Raspberry Pi RP2040 (dual Cortex-M0+) board cfg. Flash is EXTERNAL QSPI mapped
# at XIP 0x10000000 (the chip has no internal flash + no readout-protection — the external flash is the gate).
set CM_TARGET    rp2040
set CM_FLASH_BASE 0x10000000   ;# XIP window (external QSPI flash, memory-mapped read)
set CM_FLASH_SIZE 0x00200000   ;# 2 MB typical (W25Q16)
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00042000   ;# 264 KB
set CM_PROT_KIND  none
source [file join [file dirname [info script]] cortexm.cfg]
