# cortexm-stm32l4.cfg — STMicro STM32L4 (Cortex-M4). RDP lives in FLASH_OPTR[7:0] (different from F4).
set CM_TARGET    stm32l4x
set CM_FLASH_BASE 0x08000000
set CM_FLASH_SIZE 0x00100000   ;# up to 1 MB
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00018000   ;# 96 KB (SRAM1+2)
set CM_PROT_KIND  stm32l4
source [file join [file dirname [info script]] cortexm.cfg]
