# cortexm-nrf53.cfg — Nordic nRF5340 (dual Cortex-M33: application + network core). Defaults sized for
# the APPLICATION core (1 MB flash / 512 KB RAM). The net core is a second target (nrf53.cpu.net).
# Gate = APPROTECT / SECUREAPPROTECT via the CTRL-AP (same recovery model as nRF52: ERASEALL).
set CM_TARGET    nrf53
set CM_FLASH_BASE 0x00000000
set CM_FLASH_SIZE 0x00100000   ;# app-core 1 MB
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00080000   ;# 512 KB
set CM_PROT_KIND  nrf-approtect
source [file join [file dirname [info script]] cortexm.cfg]
