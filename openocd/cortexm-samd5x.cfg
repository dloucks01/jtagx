# cortexm-samd5x.cfg — Atmel/Microchip SAM D5x/E5x (Cortex-M4). Debug-access protection via the DSU.
set CM_TARGET    atsame5x
set CM_FLASH_BASE 0x00000000
set CM_FLASH_SIZE 0x00100000   ;# up to 1 MB
set CM_SRAM_BASE  0x20000000
set CM_SRAM_SIZE  0x00040000   ;# 256 KB
set CM_PROT_KIND  sam-dsu
source [file join [file dirname [info script]] cortexm.cfg]
