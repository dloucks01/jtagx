# riscv.cfg — generic RISC-V (SiFive / VexRiscv / Linux). Paradigm E. Memory is read via the hart (no ADIv5
# mem-AP), so AXI_TARGET is the riscv core target itself (dump-os-ddr reads through it).
if {[info exists ::env(JTAG_IFACE)]} { source [find $::env(JTAG_IFACE)] } else { source [find interface/ftdi/digilent_jtag_smt2_nc.cfg] }
transport select jtag
if {[info exists ::env(JTAG_SPEED)]} { adapter speed $::env(JTAG_SPEED) } else { adapter speed 1000 }
source [find target/vd_riscv.cfg]
set ::AXI_TARGET riscv.cpu      ;# pin the dump target (no "*axi*" target to auto-detect on RISC-V)
