# pandoc default options for the whitepaper series
# Used via: pandoc --defaults=pandoc-defaults.yaml ...

from: markdown+pipe_tables+yaml_metadata_block+raw_html
to: pdf
pdf-engine: xelatex

variables:
  documentclass: article
  papersize: letter
  fontsize: 11pt
  geometry:
    - margin=1in
  linkcolor: blue
  urlcolor: blue
  colorlinks: true
  toc-depth: 2
  # xelatex Unicode-safe font choices
  mainfont: "DejaVu Serif"
  sansfont: "DejaVu Sans"
  monofont: "DejaVu Sans Mono"

table-of-contents: true
number-sections: false
standalone: true
shift-heading-level-by: 0

# Make images scale to text width if larger
default-image-extension: png
